[project]
name = "predictn-msignal"
version = "0.1.0"
description = "Predictive N-Measurement Signal Recovery with RigB Compressed Sensing"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    "diffusers>=0.27.0",
    "einops>=0.7.0",
    "timm>=1.0.0",
    "tensorboard>=2.16.0",
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
]

# ---------- GPU adaptation ----------
# torch and torchvision are pulled from the PyTorch CUDA 12.6 index.
# All other packages come from PyPI only (explicit = true).

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]
